<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora GPT</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>

<div class="app">


<!-- SIDEBAR -->
<aside class="sidebar">

<div class="sidebar-header">
<h1>Velora GPT</h1>
</div>


<div class="menu">

<button class="menu-button" id="new-chat">
<span>✎</span>
New Chat
</button>


<button class="menu-button disabled">
<span>🖼</span>
<div>
Images
<small>Coming Soon</small>
</div>
</button>


<button class="menu-button disabled">
<span>📚</span>
<div>
Library
<small>Coming Soon</small>
</div>
</button>


</div>

</aside>




<!-- MAIN CHAT -->

<main class="chat">


<div class="chat-header">
<h2>Velora GPT</h2>
<div class="orb"></div>
</div>



<div id="chat-box" class="chat-box">

<div class="message bot">
Hello 👋 I am Velora GPT. How can I help you?
</div>

</div>




<div class="input-area">

<input
id="user-input"
type="text"
placeholder="Message Velora GPT..."
autocomplete="off"
/>


<button id="send-btn">
➤
</button>


</div>


</main>


</div>



<script src="/static/js/app.js"></script>

</body>

</html>
